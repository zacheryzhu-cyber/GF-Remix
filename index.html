<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply saved/system theme before first paint to avoid a flash
      (function () {
        try {
          var t = localStorage.getItem('ix-theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <title>GlobalFoundries Concept Fab Twin</title>
    <meta name="description" content="AI-enabled Facilities Operation Management System for semiconductor fabs covering automated shift reporting, ticket lifecycle tracking, CPK and cleanroom trend analytics, IEC 62682 industrial alarm monitoring with guided OCAP actions, N+1 redundancy, and emergency response management." />
    <meta property="og:title" content="GlobalFoundries Concept Fab Twin" />
    <meta property="og:description" content="AI-enabled Facilities Operation Management System for semiconductor fabs covering automated shift reporting, ticket lifecycle tracking, CPK and cleanroom trend analytics, IEC 62682 industrial alarm monitoring with guided OCAP actions, N+1 redundancy, and emergency response management." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Suppress benign ResizeObserver notifications that browsers can report as Script error in cross-origin iframes
      window.addEventListener('error', function(event) {
        if (
          event &&
          event.message &&
          (event.message.indexOf('ResizeObserver') !== -1 ||
           event.message.indexOf('Script error') !== -1)
        ) {
          event.stopImmediatePropagation && event.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && event.reason.message && event.reason.message.indexOf('ResizeObserver') !== -1) {
          event.preventDefault && event.preventDefault();
        }
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
